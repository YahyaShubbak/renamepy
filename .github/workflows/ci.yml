name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system packages (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libimage-exiftool-perl libegl1 libgl1 libxkbcommon0 \
          libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3

    - name: Install ExifTool (macOS)
      if: runner.os == 'macOS'
      run: brew install exiftool

    - name: Install ExifTool (Windows)
      if: runner.os == 'Windows'
      run: choco install exiftool -y --no-progress

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt

    - name: Compile all modules
      run: python -m compileall -q modules RenameFiles.py Tests

    - name: Run tests
      run: python -m pytest Tests -q -rs

  minimum-versions:
    name: Tests with the oldest supported dependencies
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libimage-exiftool-perl libegl1 libgl1 libxkbcommon0 \
          libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3

    - name: Install lower bounds of requirements.txt
      run: |
        python -m pip install --upgrade pip
        python -m pip install "PyQt6==6.5.3" "PyQt6-Qt6==6.5.3" "PyExifTool==0.5.5" "pytest>=8,<10" "pytest-qt>=4.4,<5"

    - name: Run tests
      run: python -m pytest Tests -q -rs

  lint-scripts:
    name: Installer scripts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: ShellCheck install.sh
      run: shellcheck install.sh

    - name: Parse PowerShell scripts
      shell: pwsh
      run: |
        $failed = $false
        foreach ($file in @("install.ps1", "setup_exiftool.ps1")) {
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Host "${file}:$($_.Extent.StartLineNumber): $($_.Message)" }
            $failed = $true
          } else {
            Write-Host "$file parses OK"
          }
        }
        if ($failed) { exit 1 }

    - name: Batch files use CRLF and ASCII
      run: |
        # cmd.exe mis-parses labels/goto in LF-only batch files (.gitattributes
        # enforces CRLF on checkout); non-ASCII text breaks in OEM code pages.
        for f in *.bat; do
          file "$f" | grep -q "CRLF line terminators" || { echo "$f must use CRLF line endings"; exit 1; }
          if LC_ALL=C grep -q '[^[:print:][:space:]]' "$f"; then
            echo "$f must be ASCII-only"; exit 1
          fi
        done
        echo "Batch files OK"
